name: Build and Push Docker Image

on:
  pull_request:
  workflow_dispatch:
    inputs:
      image_name:
        description: 'Optional custom image name, e.g. ghcr.io/owner/claudecodeui'
        required: false
        type: string
  schedule:
    - cron: '17 */2 * * *'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  DEFAULT_IMAGE_NAME: ${{ github.repository }}
  DOCKERHUB_IMAGE: libzonda/claudecodeui-docker
  UPSTREAM_REPO: siteboon/claudecodeui

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve latest upstream release
        id: upstream
        uses: actions/github-script@v8
        with:
          script: |
            const [owner, repo] = process.env.UPSTREAM_REPO.split('/');
            const release = await github.rest.repos.getLatestRelease({ owner, repo });
            core.setOutput('tag', release.data.tag_name);
            core.setOutput('tarball_url', release.data.tarball_url);

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Resolve image names
        id: image
        run: |
          if [ -n "${{ inputs.image_name }}" ]; then
            GHCR_IMAGE="${{ inputs.image_name }}"
          else
            GHCR_IMAGE="${{ env.REGISTRY }}/${{ env.DEFAULT_IMAGE_NAME }}"
          fi
          DOCKERHUB_ENABLED=false
          if [ -n "${{ env.DOCKERHUB_USERNAME }}" ] && [ -n "${{ env.DOCKERHUB_TOKEN }}" ]; then
            DOCKERHUB_ENABLED=true
          fi
          echo "ghcr=${GHCR_IMAGE,,}" >> "$GITHUB_OUTPUT"
          echo "dockerhub=${{ env.DOCKERHUB_IMAGE }}" >> "$GITHUB_OUTPUT"
          echo "dockerhub_enabled=$DOCKERHUB_ENABLED" >> "$GITHUB_OUTPUT"
          if [ "$DOCKERHUB_ENABLED" = true ]; then
            {
              echo 'all_images<<EOF'
              echo "${GHCR_IMAGE,,}"
              echo "${{ env.DOCKERHUB_IMAGE }}"
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo 'all_images<<EOF'
              echo "${GHCR_IMAGE,,}"
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Check whether release images already exist
        id: release_check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ghcr_exists=false
          dockerhub_exists=false
          if docker buildx imagetools inspect "${{ steps.image.outputs.ghcr }}:${{ steps.upstream.outputs.tag }}" >/dev/null 2>&1; then
            ghcr_exists=true
          fi
          if [ "${{ steps.image.outputs.dockerhub_enabled }}" != 'true' ]; then
            dockerhub_exists=true
          elif docker buildx imagetools inspect "${{ steps.image.outputs.dockerhub }}:${{ steps.upstream.outputs.tag }}" >/dev/null 2>&1; then
            dockerhub_exists=true
          fi
          if [ "$ghcr_exists" = true ] && [ "$dockerhub_exists" = true ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract Docker metadata
        if: steps.release_check.outputs.exists != 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.all_images }}
          tags: |
            type=raw,value=${{ steps.upstream.outputs.tag }}
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' }}

      - name: Build smoke test image
        if: steps.release_check.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: local/claudecodeui:test
          build-args: |
            CLAUDECODEUI_SOURCE_URL=${{ steps.upstream.outputs.tarball_url }}
          cache-from: type=gha,scope=smoke
          cache-to: type=gha,mode=max,scope=smoke

      - name: Run smoke test
        if: steps.release_check.outputs.exists != 'true'
        run: |
          set -e
          cleanup() {
            docker rm -f claudecodeui-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run -d --name claudecodeui-smoke -e HOST=0.0.0.0 -e SERVER_PORT=3001 -p 3001:3001 local/claudecodeui:test
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs claudecodeui-smoke
          exit 1

      - name: Build and push
        if: steps.release_check.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CLAUDECODEUI_SOURCE_URL=${{ steps.upstream.outputs.tarball_url }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release

      - name: Verify Docker Hub tags
        if: steps.release_check.outputs.exists != 'true' && steps.image.outputs.dockerhub_enabled == 'true'
        run: |
          set -e
          for tag in "${{ steps.upstream.outputs.tag }}" latest; do
            found=false
            for i in $(seq 1 12); do
              if docker buildx imagetools inspect "docker.io/${{ steps.image.outputs.dockerhub }}:${tag}" >/dev/null 2>&1; then
                found=true
                break
              fi
              sleep 10
            done
            if [ "$found" != true ]; then
              echo "Docker Hub tag not visible after push: $tag"
              exit 1
            fi
          done

      - name: Update Docker Hub README
        if: github.event_name != 'pull_request' && env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
          repository: ${{ steps.image.outputs.dockerhub }}
          readme-filepath: ./README.dockerhub.md
          short-description: Docker image packaging for siteboon/claudecodeui

      - name: Skip because release already exists
        if: steps.release_check.outputs.exists == 'true'
        run: echo "Image ${{ steps.image.outputs.ghcr }}:${{ steps.upstream.outputs.tag }} already exists, skipping build and push."
