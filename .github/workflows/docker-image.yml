name: Build and Push Docker Image

on:
  pull_request:
  workflow_dispatch:
    inputs:
      image_name:
        description: 'Optional custom image name, e.g. ghcr.io/owner/claudecodeui'
        required: false
        type: string
  schedule:
    - cron: '17 */2 * * *'

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  DOCKERHUB_IMAGE: libzonda/claudecodeui-docker
  UPSTREAM_REPO: siteboon/claudecodeui

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    outputs:
      tag: ${{ steps.upstream.outputs.tag }}
      ghcr: ${{ steps.image.outputs.ghcr }}
      dockerhub: ${{ steps.image.outputs.dockerhub }}
      dockerhub_enabled: ${{ steps.image.outputs.dockerhub_enabled }}
      all_images: ${{ steps.image.outputs.all_images }}
      exists: ${{ steps.release_check.outputs.exists }}
    steps:
      - name: Resolve latest upstream release
        id: upstream
        uses: actions/github-script@v8
        with:
          script: |
            const [owner, repo] = process.env.UPSTREAM_REPO.split('/');
            const release = await github.rest.repos.getLatestRelease({ owner, repo });
            core.setOutput('tag', release.data.tag_name);

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve image names
        id: image
        run: |
          if [ -n "${{ inputs.image_name }}" ]; then
            GHCR_IMAGE="${{ inputs.image_name }}"
          else
            GHCR_IMAGE="${{ env.REGISTRY }}/${{ github.repository }}"
          fi
          DOCKERHUB_ENABLED=false
          if [ -n "${{ env.DOCKERHUB_USERNAME }}" ] && [ -n "${{ env.DOCKERHUB_TOKEN }}" ]; then
            DOCKERHUB_ENABLED=true
          fi
          echo "ghcr=${GHCR_IMAGE,,}" >> "$GITHUB_OUTPUT"
          echo "dockerhub=${{ env.DOCKERHUB_IMAGE }}" >> "$GITHUB_OUTPUT"
          echo "dockerhub_enabled=$DOCKERHUB_ENABLED" >> "$GITHUB_OUTPUT"
          if [ "$DOCKERHUB_ENABLED" = true ]; then
            {
              echo 'all_images<<EOF'
              echo "${GHCR_IMAGE,,}"
              echo "${{ env.DOCKERHUB_IMAGE }}"
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo 'all_images<<EOF'
              echo "${GHCR_IMAGE,,}"
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Check whether release images already exist
        id: release_check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ghcr_exists=false
          dockerhub_exists=false
          if docker buildx imagetools inspect "${{ steps.image.outputs.ghcr }}:${{ steps.upstream.outputs.tag }}" >/dev/null 2>&1; then
            ghcr_exists=true
          fi
          if [ "${{ steps.image.outputs.dockerhub_enabled }}" != 'true' ]; then
            dockerhub_exists=true
          elif docker buildx imagetools inspect "${{ steps.image.outputs.dockerhub }}:${{ steps.upstream.outputs.tag }}" >/dev/null 2>&1; then
            dockerhub_exists=true
          fi
          if [ "$ghcr_exists" = true ] && [ "$dockerhub_exists" = true ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  smoke-test:
    needs: prepare
    if: needs.prepare.outputs.exists != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build smoke test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: local/claudecodeui:test
          cache-from: type=gha,scope=image-build-amd64
          cache-to: type=gha,mode=max,scope=image-build-amd64

      - name: Run smoke test
        run: |
          set -e
          cleanup() {
            docker rm -f claudecodeui-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run -d --name claudecodeui-smoke -e HOST=0.0.0.0 -e SERVER_PORT=3001 -p 3001:3001 local/claudecodeui:test
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs claudecodeui-smoke
          exit 1

  build-platform:
    needs: [prepare, smoke-test]
    if: needs.prepare.outputs.exists != 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
            needs_qemu: false
          - platform: linux/arm64
            suffix: arm64
            needs_qemu: true
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        if: matrix.needs_qemu
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: needs.prepare.outputs.dockerhub_enabled == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Resolve platform tags
        id: tags
        run: |
          if [ -n "${{ inputs.image_name }}" ]; then
            GHCR_IMAGE="${{ inputs.image_name }}"
          else
            GHCR_IMAGE="${{ env.REGISTRY }}/${{ github.repository }}"
          fi
          GHCR_IMAGE="${GHCR_IMAGE,,}"
          GHCR_TAGS="$GHCR_IMAGE:${{ needs.prepare.outputs.tag }}-${{ matrix.suffix }},$GHCR_IMAGE:latest-${{ matrix.suffix }}"
          if [ "${{ needs.prepare.outputs.dockerhub_enabled }}" = "true" ]; then
            ALL_TAGS="$GHCR_TAGS,${{ env.DOCKERHUB_IMAGE }}:${{ needs.prepare.outputs.tag }}-${{ matrix.suffix }},${{ env.DOCKERHUB_IMAGE }}:latest-${{ matrix.suffix }}"
          else
            ALL_TAGS="$GHCR_TAGS"
          fi
          echo "tags=$ALL_TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push platform image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=image-build-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=image-build-${{ matrix.suffix }}

  merge-manifests:
    needs: [prepare, build-platform]
    if: needs.prepare.outputs.exists != 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: needs.prepare.outputs.dockerhub_enabled == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Create GHCR multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t "${{ needs.prepare.outputs.ghcr }}:${{ needs.prepare.outputs.tag }}" \
            -t "${{ needs.prepare.outputs.ghcr }}:latest" \
            "${{ needs.prepare.outputs.ghcr }}:${{ needs.prepare.outputs.tag }}-amd64" \
            "${{ needs.prepare.outputs.ghcr }}:${{ needs.prepare.outputs.tag }}-arm64"

      - name: Create Docker Hub multi-arch manifest
        if: needs.prepare.outputs.dockerhub_enabled == 'true'
        run: |
          docker buildx imagetools create \
            -t "${{ needs.prepare.outputs.dockerhub }}:${{ needs.prepare.outputs.tag }}" \
            -t "${{ needs.prepare.outputs.dockerhub }}:latest" \
            "${{ needs.prepare.outputs.dockerhub }}:${{ needs.prepare.outputs.tag }}-amd64" \
            "${{ needs.prepare.outputs.dockerhub }}:${{ needs.prepare.outputs.tag }}-arm64"

      - name: Verify Docker Hub tags
        if: needs.prepare.outputs.dockerhub_enabled == 'true'
        run: |
          set -e
          for tag in "${{ needs.prepare.outputs.tag }}" latest; do
            found=false
            for i in $(seq 1 12); do
              if docker buildx imagetools inspect "docker.io/${{ needs.prepare.outputs.dockerhub }}:${tag}" >/dev/null 2>&1; then
                found=true
                break
              fi
              sleep 10
            done
            if [ "$found" != true ]; then
              echo "Docker Hub tag not visible after push: $tag"
              exit 1
            fi
          done

      - name: Checkout
        if: needs.prepare.outputs.dockerhub_enabled == 'true'
        uses: actions/checkout@v5

      - name: Update Docker Hub README
        if: needs.prepare.outputs.dockerhub_enabled == 'true'
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
          repository: ${{ needs.prepare.outputs.dockerhub }}
          readme-filepath: ./README.dockerhub.md
          short-description: Docker image packaging for siteboon/claudecodeui

  skip-release:
    needs: prepare
    if: needs.prepare.outputs.exists == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Skip because release already exists
        run: echo "Image ${{ needs.prepare.outputs.ghcr }}:${{ needs.prepare.outputs.tag }} already exists, skipping build and push."
