name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      image_name:
        description: 'Optional custom image name, e.g. ghcr.io/owner/claudecodeui'
        required: false
        type: string
      upstream_ref:
        description: 'Upstream claudecodeui ref to build, default main'
        required: false
        default: 'main'
        type: string

env:
  REGISTRY: ghcr.io
  DEFAULT_IMAGE_NAME: ${{ github.repository }}
  UPSTREAM_REPO: https://github.com/siteboon/claudecodeui.git

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image name
        id: image
        run: |
          if [ -n "${{ inputs.image_name }}" ]; then
            IMAGE_NAME="${{ inputs.image_name }}"
          else
            IMAGE_NAME="${{ env.REGISTRY }}/${{ env.DEFAULT_IMAGE_NAME }}"
          fi
          echo "name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Resolve upstream ref
        id: upstream
        run: |
          REF="${{ inputs.upstream_ref }}"
          if [ -z "$REF" ]; then
            REF="main"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CLAUDECODEUI_REPO=${{ env.UPSTREAM_REPO }}
            CLAUDECODEUI_REF=${{ steps.upstream.outputs.ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
