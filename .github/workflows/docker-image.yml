name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      image_name:
        description: 'Optional custom image name, e.g. ghcr.io/owner/claudecodeui'
        required: false
        type: string
  schedule:
    - cron: '17 3 * * *'

env:
  REGISTRY: ghcr.io
  DEFAULT_IMAGE_NAME: ${{ github.repository }}
  UPSTREAM_REPO: siteboon/claudecodeui

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve latest upstream release
        id: upstream
        uses: actions/github-script@v7
        with:
          script: |
            const [owner, repo] = process.env.UPSTREAM_REPO.split('/');
            const release = await github.rest.repos.getLatestRelease({ owner, repo });
            core.setOutput('tag', release.data.tag_name);
            core.setOutput('tarball_url', release.data.tarball_url);

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image name
        id: image
        run: |
          if [ -n "${{ inputs.image_name }}" ]; then
            IMAGE_NAME="${{ inputs.image_name }}"
          else
            IMAGE_NAME="${{ env.REGISTRY }}/${{ env.DEFAULT_IMAGE_NAME }}"
          fi
          echo "name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Check whether release image already exists
        id: release_check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if docker buildx imagetools inspect "${{ steps.image.outputs.name }}:${{ steps.upstream.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract Docker metadata
        if: steps.release_check.outputs.exists != 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ steps.upstream.outputs.tag }}
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' }}

      - name: Build smoke test image
        if: steps.release_check.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: local/claudecodeui:test
          build-args: |
            CLAUDECODEUI_SOURCE_URL=${{ steps.upstream.outputs.tarball_url }}
          cache-from: type=gha,scope=smoke
          cache-to: type=gha,mode=max,scope=smoke

      - name: Run smoke test
        if: steps.release_check.outputs.exists != 'true'
        run: |
          set -e
          cleanup() {
            docker rm -f claudecodeui-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run -d --name claudecodeui-smoke -e HOST=0.0.0.0 -e SERVER_PORT=3001 -p 3001:3001 local/claudecodeui:test
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs claudecodeui-smoke
          exit 1

      - name: Build and push
        if: steps.release_check.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CLAUDECODEUI_SOURCE_URL=${{ steps.upstream.outputs.tarball_url }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release

      - name: Skip because release already exists
        if: steps.release_check.outputs.exists == 'true'
        run: echo "Image ${{ steps.image.outputs.name }}:${{ steps.upstream.outputs.tag }} already exists, skipping build and push."
